<svg viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Inter,system-ui,sans-serif}.h{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700}</style><defs><marker id="ph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2D452F"/></marker><marker id="phs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2D452F"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="pms" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#C0392B"/></marker></defs><text x="10" y="36" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#4F6075">STATUS SIKLUS BUDIDAYA DI BACKEND</text>
