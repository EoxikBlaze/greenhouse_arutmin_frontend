openapi: 3.0.3
info:
  title: GARAP API
  description: |
    Kontrak resmi backend Node.js GARAP (Express 4 + PostgreSQL 17).
    Nama rute 1:1 dengan kontrak Laravel lama. JSON-only kecuali 3 rute CSV.
    110 operasi = seluruh rute yang terdaftar di backend-nodejs/src (index.js +
    routes/*.js + routes/_crud.js). Tiap operasi memuat operationId unik dan
    x-source: <file>:<baris> sebagai rujukan ke kode sumbernya.
    Sumber manusia-baca: docs/KONTRAK_API.md · smoke test: backend-nodejs/scripts/smoke-test.sh
  version: 1.1.0
  contact:
    name: GARAP
servers:
  - url: http://127.0.0.1:8000
    description: Development (Mac, bind localhost)
  - url: http://raspberry-pi.local
    description: Produksi (Raspberry Pi, nginx :80 ke 127.0.0.1:8000)
tags:
  - name: Autentikasi
  - name: ESP32
  - name: Dashboard dan Monitoring
  - name: Tanam
  - name: Water Control dan Laporan
  - name: Master dan Tahap
  - name: User dan Profil
  - name: Notifikasi WA
  - name: Konfigurasi V2

security:
  - bearerAuth: []

paths:
  /:
    get:
      operationId: getRoot
      x-source: backend-nodejs/src/routes/auth.js:8
      tags: [Autentikasi]
      summary: Info endpoint (publik)
      security: []
      responses:
        "200":
          description: Info singkat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "204": { description: "Dibuka dari address bar (Sec-Fetch-Mode navigate) — body kosong" }
        "500": { $ref: "#/components/responses/ServerError" }

  /login:
    get:
      operationId: getLogin
      x-source: backend-nodejs/src/routes/auth.js:12
      tags: [Autentikasi]
      summary: Info endpoint login (publik)
      security: []
      responses:
        "200":
          description: Info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: postLogin
      x-source: backend-nodejs/src/routes/auth.js:16
      tags: [Autentikasi]
      summary: "Login, menghasilkan JWT (rate limit 10/menit/IP)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { username: admin, password: "***" }
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "422":
          description: Username atau password salah / data tidak valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "429": { description: "Rate limit — coba lagi dalam 60 detik" }
        "500": { $ref: "#/components/responses/ServerError" }

  /logout:
    get:
      operationId: getLogout
      x-source: backend-nodejs/src/routes/auth.js:45
      tags: [Autentikasi]
      summary: Logout (stateless, client membuang token)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "500": { $ref: "#/components/responses/ServerError" }

  /dashboard:
    get:
      operationId: getDashboard
      x-source: backend-nodejs/src/routes/dashboard.js:9
      tags: [Dashboard dan Monitoring]
      summary: Ringkasan dashboard semua role, cache 5 detik
      responses:
        "200":
          description: Metrik + status IoT + pipeline 4 tahap + riwayat panen/alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring:
    get:
      operationId: getMonitoring
      x-source: backend-nodejs/src/routes/monitoring.js:134
      tags: [Dashboard dan Monitoring]
      summary: Halaman monitoring (semua role)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { page: { type: string, example: monitoring } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/chart-data:
    get:
      operationId: getMonitoringChartData
      x-source: backend-nodejs/src/routes/monitoring.js:138
      tags: [Dashboard dan Monitoring]
      summary: 288 baris sensor terakhir untuk grafik, urut mundur
      responses:
        "200":
          description: Array pembacaan sensor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Monitoring" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/tarik:
    get:
      operationId: getMonitoringTarik
      x-source: backend-nodejs/src/routes/monitoring.js:145
      tags: [Dashboard dan Monitoring]
      summary: Riwayat sensor terfilter (dari/sampai/per_page)
      parameters:
        - name: dari
          in: query
          required: false
          description: Batas bawah (timestamptz; kosong = tanpa batas)
          schema: { type: string }
        - name: sampai
          in: query
          required: false
          description: Batas atas (timestamptz; kosong = tanpa batas)
          schema: { type: string }
        - name: per_page
          in: query
          required: false
          description: "Batas baris — nilai di luar daftar jatuh ke 10"
          schema: { type: integer, enum: [10, 25, 50, 100], default: 10 }
      responses:
        "200":
          description: "Objek {dari, sampai, data:[…]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  dari: { type: string, nullable: true }
                  sampai: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Monitoring" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/tarik/csv:
    get:
      operationId: getMonitoringTarikCsv
      x-source: backend-nodejs/src/routes/monitoring.js:160
      tags: [Dashboard dan Monitoring]
      summary: Unduh riwayat sensor dalam CSV (maks 5000 baris)
      parameters:
        - name: dari
          in: query
          required: false
          schema: { type: string }
        - name: sampai
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: file CSV (BOM UTF-8)
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/getReport6Jam:
    get:
      operationId: getMonitoringGetReport6Jam
      x-source: backend-nodejs/src/routes/monitoring.js:99
      tags: [Dashboard dan Monitoring]
      summary: Rata-rata sensor 6 jam + alert 6 jam (publik)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sensor: { type: object, additionalProperties: true }
                  alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/saveSensor:
    post:
      operationId: postMonitoringSaveSensor
      x-source: backend-nodejs/src/routes/monitoring.js:114
      tags: [Dashboard dan Monitoring]
      summary: "Kompatibilitas CI4 — simpan bacaan sensor (wajib X-API-KEY), identik /api/save-sensor"
      security: [{ apiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSensorRequest" }
      responses:
        "200":
          description: Diterima, command harus dieksekusi perangkat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSensorResponse" }
        "400":
          description: 'Payload kosong — {"status":"error","message":"No payload"}'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/ForbiddenDevice" }
        "500": { $ref: "#/components/responses/ServerError" }

  /monitoring/saveAlert:
    post:
      operationId: postMonitoringSaveAlert
      x-source: backend-nodejs/src/routes/monitoring.js:124
      tags: [Dashboard dan Monitoring]
      summary: Simpan alert (wajib X-API-KEY)
      security: [{ apiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, example: solenoid }
                value: { type: string, example: "ON (manual)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
        "400":
          description: 'type/value tidak terkirim — {"status":"error"}'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/ForbiddenDevice" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/latest-sensor:
    get:
      operationId: getApiLatestSensor
      x-source: backend-nodejs/src/routes/monitoring.js:180
      tags: [ESP32]
      summary: Sensor terkini + status alat + anomali (publik, cache 2 detik)
      security: []
      parameters:
        - name: device
          in: query
          required: false
          description: "(USULAN, belum aktif) filter perangkat untuk skema 2 ESP32"
          schema: { type: string, example: esp32-a }
      responses:
        "200":
          description: Payload live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestSensor" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/get-thresholds:
    get:
      operationId: getApiGetThresholds
      x-source: backend-nodejs/src/routes/monitoring.js:184
      tags: [ESP32]
      summary: Ambang sensor untuk perangkat (X-API-KEY, cache 60 detik)
      security: [{ apiKeyHeader: [] }]
      responses:
        "200":
          description: Ambang 5 sensor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thresholds" }
        "403": { $ref: "#/components/responses/ForbiddenDevice" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/save-sensor:
    post:
      operationId: postApiSaveSensor
      x-source: backend-nodejs/src/routes/monitoring.js:196
      tags: [ESP32]
      summary: "Simpan bacaan sensor (X-API-KEY), 1 CTE, anti-duplikat + insert + state katup"
      security: [{ apiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSensorRequest" }
            example:
              waterTemp: 26.9
              ph: 6.5
              tds: 1200
              airTemp: 31
              humidity: 66
              water_level: Sedang
              solenoid_state: "OFF"
      responses:
        "200":
          description: Diterima, command harus dieksekusi perangkat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSensorResponse" }
        "400":
          description: 'Payload kosong — {"status":"error","message":"No payload"}'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/ForbiddenDevice" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/notif-hardware:
    post:
      operationId: postApiNotifHardware
      x-source: backend-nodejs/src/routes/monitoring.js:206
      tags: [ESP32]
      summary: Peringatan hardware masuk alert_logs (X-API-KEY, cooldown per tipe)
      security: [{ apiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, example: solenoid }
                value: { type: string, example: "ON (uji node)" }
      responses:
        "200":
          description: 'OK — {"status":"cooldown"} bila masih dalam jeda'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status: { description: "true bila tersimpan, 'cooldown' bila masih dalam jeda" }
        "400":
          description: 'type/value kosong — {"status":false,"msg":"type dan value wajib"}'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/ForbiddenDevice" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tanam:
    get:
      operationId: getTanam
      x-source: backend-nodejs/src/routes/tanam.js:62
      tags: [Tanam]
      summary: Gabungan semai, peremajaan, pendewasaan (semua role)
      responses:
        "200":
          description: Daftar aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: string, example: tanam }
                  list:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tanam/mulai:
    post:
      operationId: postTanamMulai
      x-source: backend-nodejs/src/routes/tanam.js:89
      tags: [Tanam]
      summary: "Mulai tanam baru = buat batch semai (demo, expires_at +1 jam)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_tanaman: { type: integer }
                id_siklus: { type: integer }
                id_meja: { type: integer }
                jumlah_benih: { type: integer, example: 1000 }
                tgl_awal_semai: { type: string, format: date }
                keterangan: { type: string }
      responses:
        "201":
          description: Berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "422":
          description: "FK tak terdaftar / tanggal bukan YYYY-MM-DD / integer salah"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tanam/{tipe}/{id}/selesai:
    post:
      operationId: postTanamTipeIdSelesai
      x-source: backend-nodejs/src/routes/tanam.js:107
      tags: [Tanam]
      summary: Selesai satu tahap — tutup tanggal akhir + status selesai
      parameters:
        - name: tipe
          in: path
          required: true
          description: Tahap yang diselesaikan (nilai lain → 422)
          schema: { type: string, enum: [semai, peremajaan, pendewasaan, panen] }
        - name: id
          in: path
          required: true
          description: "PK bigint — non-angka / di luar rentang → 404 seragam (kontrak §2b)"
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: Tahap diselesaikan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Tahap tidak dikenal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tanam/{id}/hapus:
    post:
      operationId: postTanamIdHapus
      x-source: backend-nodejs/src/routes/tanam.js:129
      tags: [Tanam]
      summary: Hapus batch semai (konfirmasi di client; demo ditolak)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: Terhapus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Mode demo tidak boleh menghapus data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /watercontrol:
    get:
      operationId: getWatercontrol
      x-source: backend-nodejs/src/routes/watercontrol.js:9
      tags: [Water Control dan Laporan]
      summary: Halaman kontrol air + state katup (admin + demo)
      responses:
        "200":
          description: "Objek {page, wc}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: string, example: watercontrol }
                  wc: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /watercontrol/status:
    get:
      operationId: getWatercontrolStatus
      x-source: backend-nodejs/src/routes/watercontrol.js:14
      tags: [Water Control dan Laporan]
      summary: State katup dan mode (admin + demo)
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, example: "1" }
                  command: { type: string, example: AUTO }
                  mode: { type: string, example: MANUAL }
                  valve_state: { type: string, example: "OFF" }
                  updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /watercontrol/fill:
    post:
      operationId: postWatercontrolFill
      x-source: backend-nodejs/src/routes/watercontrol.js:19
      tags: [Water Control dan Laporan]
      summary: Perintah isi air FORCE_FILL (admin; demo ditolak)
      responses:
        "200":
          description: Perintah terkirim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /watercontrol/stop:
    post:
      operationId: postWatercontrolStop
      x-source: backend-nodejs/src/routes/watercontrol.js:26
      tags: [Water Control dan Laporan]
      summary: Hentikan pengisian FORCE_STOP (admin; demo ditolak)
      responses:
        "200":
          description: Perintah terkirim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /watercontrol/setMode:
    post:
      operationId: postWatercontrolSetMode
      x-source: backend-nodejs/src/routes/watercontrol.js:33
      tags: [Water Control dan Laporan]
      summary: Ubah mode katup (admin, demo ditolak)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [AUTO, MANUAL] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "422":
          description: Mode bukan AUTO/MANUAL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "500": { $ref: "#/components/responses/ServerError" }

  /laporan:
    get:
      operationId: getLaporan
      x-source: backend-nodejs/src/routes/laporan.js:26
      tags: [Water Control dan Laporan]
      summary: Matriks laporan per bulan (admin + demo)
      parameters:
        - name: dari
          in: query
          required: false
          schema: { type: string }
        - name: sampai
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matriks
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: string, example: laporan }
                  matriks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /laporan/csv:
    get:
      operationId: getLaporanCsv
      x-source: backend-nodejs/src/routes/laporan.js:33
      tags: [Water Control dan Laporan]
      summary: Unduh matriks laporan sebagai CSV
      parameters:
        - name: dari
          in: query
          required: false
          schema: { type: string }
        - name: sampai
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 'file CSV — nama laporan-<dari>_<sampai>.csv (BOM UTF-8)'
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifikasi-wa:
    get:
      operationId: getNotifikasiWa
      x-source: backend-nodejs/src/routes/notifWa.js:49
      tags: [Notifikasi WA]
      summary: Pengaturan notifikasi WA (api_key hanya versi tersamar)
      responses:
        "200":
          description: Pengaturan + daftar tipe pesan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifWaSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: postNotifikasiWa
      x-source: backend-nodejs/src/routes/notifWa.js:66
      tags: [Notifikasi WA]
      summary: Simpan pengaturan notifikasi WA (api_key di-encrypt AES, demo ditolak)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifWaInput" }
      responses:
        "200":
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenRole" }
        "500": { $ref: "#/components/responses/ServerError" }

  /notifikasi-wa/uji:
    post:
      operationId: postNotifikasiWaUji
      x-source: backend-nodejs/src/routes/notifWa.js:77
      tags: [Notifikasi WA]
      summary: Kirim pesan uji Fonnte (best-effort, demo ditolak)
      responses:
        "200":
          description: Hasil pengiriman (berhasil / gagal / belum dikonfigurasi)
