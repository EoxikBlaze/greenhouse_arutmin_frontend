components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token dari POST /login, berlaku 12 jam, header Authorization: Bearer ***"
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
      description: "Kunci ESP32 dari .env (ESP32_API_KEY); skema 2 perangkat memakai ESP32_KEY_A dan ESP32_KEY_B"

  parameters:
    IdBigint:
      name: id
      in: path
      required: true
      description: "PK bigint — non-angka ATAU di luar rentang → 404 identik dengan id yang tidak ada (kontrak §2b, anti-enumeration)"
      schema: { type: string, pattern: "^[0-9]+$" }
    ParamVarchar:
      name: param
      in: path
      required: true
      description: "PK varchar(64) — melebihi panjang → 404 identik (kontrak §2b)"
      schema: { type: string, maxLength: 64 }
    KodeVarchar:
      name: kode
      in: path
      required: true
      description: "PK varchar(64) — melebihi panjang → 404 identik (kontrak §2b)"
      schema: { type: string, maxLength: 64 }
    SensorVarchar:
      name: sensor
      in: path
      required: true
      description: "PK varchar — nama sensor (kolom kalibrasi_sensor.sensor)"
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthorized:
      description: Tidak ada atau tidak valid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: "Tidak terautentikasi." }
    ForbiddenRole:
      description: Role tidak diizinkan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: "Menu ini untuk pengelola. Silakan gunakan menu Tanam Saya." }
    ForbiddenDevice:
      description: X-API-KEY salah
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: boolean, example: false }
              msg: { type: string, example: Unauthorized }
    NotFound:
      description: "Data tidak ada / id tidak valid — body byte-identik untuk ketiga kasus (kontrak §2b)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageErrors" }
          example: { message: "Data tidak ditemukan.", errors: {} }
    Conflict:
      description: "FK ON DELETE RESTRICT — data terkait masih merujuk (_crud.js P4)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageErrors" }
          example: { message: "Tidak bisa menghapus meja: masih ada data terkait yang merujuknya.", errors: {} }
    ValidationFailed:
      description: Validasi aplikasi gagal (Zod / cek FK / cek rentang) — kontrak §2
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    ServerError:
      description: "Kesalahan tak terduga di server (handler global index.js) — generik, tanpa stack trace"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: "Terjadi kesalahan pada server." }

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    MessageErrors:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }

    ValidationError:
      type: object
      properties:
        message: { type: string, example: "Data tidak valid." }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        input:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, example: admin }
        password: { type: string, minLength: 3, format: password }
        remember: { type: boolean, nullable: true }

    LoginResponse:
      type: object
      properties:
        status: { type: boolean, example: true }
        message: { type: string, example: "Login berhasil." }
        token: { type: string, description: "JWT HS256, 12 jam, sekitar 205 karakter" }
        user: { $ref: "#/components/schemas/User" }
        redirect: { type: string, example: /dashboard }

    User:
      type: object
      properties:
        id: { type: string, example: "1" }
        username: { type: string, example: admin }
        email: { type: string, nullable: true, example: admin@politala.ac.id }
        level: { type: string, enum: [admin, user, petani], example: admin }
        is_demo: { type: boolean, example: false }

    UserInput:
      type: object
      required: [username, password]
      description: "Sumber: routes/user.js:31-36 (validasi manual, bukan Zod)"
      properties:
        username: { type: string, minLength: 3, description: "min 3 karakter; unik" }
        email: { type: string, nullable: true }
        password: { type: string, minLength: 6, format: password }
        level: { type: string, enum: [admin, user, petani], default: user }
        is_demo: { type: boolean, default: false }

    UserUpdate:
      type: object
      description: "Semua opsional; setidaknya satu kolom wajib (user.js:79). password di-hash bcrypt cost 12."
      properties:
        username: { type: string, minLength: 3 }
        email: { type: string, nullable: true }
        password: { type: string, minLength: 6, format: password }
        level: { type: string, enum: [admin, user, petani] }
        is_demo: { type: boolean }

    ProfilUpdate:
      type: object
      properties:
        username: { type: string, minLength: 3 }
        email: { type: string, nullable: true }

    PasswordInput:
      type: object
      required: [password_lama, password, password_confirmation]
      properties:
        password_lama: { type: string, format: password }
        password: { type: string, minLength: 6, format: password }
        password_confirmation: { type: string, minLength: 6 }

    NotifWaInput:
      type: object
      description: "api_key di-encrypt AES (crypto.js) dan tidak pernah dikirim balik (notifWa.js:66-75)"
      properties:
        aktif: { type: boolean, default: false }
        api_key: { type: string, description: "kosong/null → kolom di-set NULL" }
        target: { type: string, description: "nomor WA, dipisah koma" }

    NotifWaSetting:
      type: object
      properties:
        page: { type: string, example: notifikasi-wa }
        aktif: { type: boolean }
        api_key_masked: { type: string, nullable: true, example: "abcdef***" }
        target: { type: string, nullable: true }
        tipe_pesan:
          type: array
          items:
            type: object
            properties:
              tipe: { type: string, example: solenoid }
              pemicu: { type: string }
              konten: { type: string }

    Dashboard:
      type: object
      properties:
        page: { type: string, example: dashboard }
        iotStatus:
          type: object
          properties:
            online: { type: boolean, example: false }
            seconds_ago: { type: integer, example: 196944 }
            diff_text: { type: string, example: "196944 detik yang lalu" }
            last_seen: { type: string, format: date-time, nullable: true }
        total_tanaman: { type: integer, example: 2 }
        total_meja: { type: integer, example: 5 }
        total_siklus: { type: integer, example: 6 }
        total_semai: { type: integer, example: 2 }
        total_peremajaan: { type: integer, example: 4 }
        total_pendewasaan: { type: integer, example: 3 }
        total_panen: { type: integer, example: 2 }
        total_panen_qty: { type: integer, example: 22 }
        semai_aktif: { type: integer }
        peremajaan_aktif: { type: integer }
        pendewasaan_aktif: { type: integer }
        latest_sensor: { type: object, additionalProperties: true }
        sensor_avg: { type: object, nullable: true, additionalProperties: true }
        water_control: { type: object, nullable: true, additionalProperties: true }
        recent_alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        recent_panen: { type: array, items: { type: object, additionalProperties: true } }

    Monitoring:
      type: object
      properties:
        id: { type: string, example: "1" }
        waterTemp: { type: number, nullable: true, example: 26.1 }
        ph: { type: number, nullable: true, example: 6.4 }
        tds: { type: number, nullable: true, example: 1180 }
        airTemp: { type: number, nullable: true, example: 31.2 }
        humidity: { type: number, nullable: true, example: 68 }
        water_level: { type: string, nullable: true, example: Sedang }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Alert:
      type: object
      properties:
        id: { type: string, example: "3" }
        type: { type: string, example: uji }
        value: { type: string, example: x0 }
        created_at: { type: string, format: date-time }

    LatestSensor:
      type: object
      properties:
        is_online: { type: boolean, description: "true bila data terakhir <= 120 detik" }
